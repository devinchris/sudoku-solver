[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku-solvers"
version = "0.6.7"
description = "Sudoku-Solver (Backtracking und SAT) mit Auswertung und UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sudoku",   # gen bib die nils gefunden hat
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]